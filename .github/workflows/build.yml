name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test synthetic provider and account behavior
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build.ps1
